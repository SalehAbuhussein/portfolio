<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saleh Abuhussein · Angular frontend developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Saleh Abuhussein is an Angular frontend developer in Amman, Jordan. He also builds full-stack projects with ASP.NET Core and SQL Server.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    @font-face {
      font-family: 'Archivo';
      src: url('fonts/archivo.woff2') format('woff2');
      font-weight: 100 900;
      font-stretch: 62% 125%;
      font-display: swap;
    }
  </style>
  <script>
    // Set theme and enable reveal animations before first paint, so there is no flash.
    (function () {
      var d = document.documentElement;
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.dataset.theme = t;
      d.classList.add('js');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
